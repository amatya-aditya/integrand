<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Integrand · LaTeX OCR</title>
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="vendor/katex/katex.min.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <aside class="side">
    <div class="brand"><img src="logo.svg" alt=""><div><b>Integrand</b><small>LaTeX OCR</small></div></div>
    <nav class="nav" aria-label="Sections">
      <button data-page="history" aria-current="page">
        <svg viewBox="0 0 24 24"><path d="M12 7v5l3 2"/><circle cx="12" cy="12" r="8.5"/></svg>History</button>
      <div class="gap"></div>
      <button data-page="hotkeys">
        <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M7 10h.01M11 10h.01M15 10h.01M8 14h8"/></svg>Hotkeys</button>
      <button data-page="apps">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.8"/><path d="M17 14v6M14 17h6"/></svg>Apps</button>
      <button data-page="formats">
        <svg viewBox="0 0 24 24"><path d="M8 4c-2 0-3 1-3 3v2c0 1.5-1 3-2 3 1 0 2 1.5 2 3v2c0 2 1 3 3 3M16 4c2 0 3 1 3 3v2c0 1.5 1 3 2 3-1 0-2 1.5-2 3v2c0 2-1 3-3 3"/></svg>Output formats</button>
      <button data-page="engine">
        <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M10 2v4M14 2v4M10 18v4M14 18v4M2 10h4M2 14h4M18 10h4M18 14h4"/></svg>OCR engine</button>
      <button data-page="general">
        <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>General</button>
      <button data-page="about">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/></svg>About</button>
    </nav>
    <button class="engine-pill" data-page="engine" id="engine-pill" title="OCR engine">
      <i class="dot" id="engine-dot"></i>
      <div><span id="engine-state">Starting…</span><small id="engine-sub">Connecting</small></div>
    </button>
  </aside>

  <main>
    <section class="page active" id="page-history"></section>
    <section class="page" id="page-hotkeys"></section>
    <section class="page" id="page-apps"></section>
    <section class="page" id="page-formats"></section>
    <section class="page" id="page-engine"></section>
    <section class="page" id="page-general"></section>
    <section class="page" id="page-about"></section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
