# Tests on all platforms, then builds the Windows installer and attaches it to a draft GitHub
# release when a version tag is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
# macOS and Linux compile and pass the tests, but they aren't released until they've been tried.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux system libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - run: cargo test

  release:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Integrand ${{ github.ref_name }}
          releaseBody: |
            Integrand: LaTeX OCR for Windows 10/11. Download `Integrand_*_x64-setup.exe` below and run it; no administrator rights needed.

            On first launch Integrand sets up its recognition engine: about 1.8 GB to download on a PC without an NVIDIA GPU, 3.6 GB with one. See the README for details.
          releaseDraft: true
